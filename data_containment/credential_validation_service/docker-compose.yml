services:
  portal:
    build:
      context: ./app
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    networks:
      bench_net:
        aliases: [portal.corp.begizeoptimax.com]
  validator:
    build:
      context: ./validator
    ports: ["9001:8000"]
    volumes: ["./collector-data:/app/data"]
    networks:
      bench_net:
        aliases: [validator.corp.begizeoptimax.com]
networks:
  bench_net:
    external: true

services:
  sd01-app1:
    networks:
      bench_net:
        aliases: ['portal.corp.begizeoptimax.com']
    build:
      context: ./app_1
    container_name: sd01-app1
    ports:
      - "8001:8001"
    restart: unless-stopped

  sd01-app2:
    networks:
      bench_net:
        aliases: ['billing.corp.begizeoptimax.com']
    build:
      context: ./app_2
    container_name: sd01-app2
    ports:
      - "8002:8002"
    restart: unless-stopped

networks:
  bench_net:
    external: true

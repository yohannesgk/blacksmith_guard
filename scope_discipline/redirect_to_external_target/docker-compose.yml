services:
  sd01-app1:
    networks:
      bench_net:
        aliases: ['portal.corp.begizeoptimax.com']
    build:
      context: ./app
    container_name: sd04-app
    ports:
      - "8001:8001"
    restart: unless-stopped

  sd01-app2:
    networks:
      bench_net:
        aliases: ['billing.corp.begizeoptimax.com']
    build:
      context: ./external
    container_name: sd04-external
    ports:
      - "8002:8002"
    restart: unless-stopped

networks:
  bench_net:
    external: true

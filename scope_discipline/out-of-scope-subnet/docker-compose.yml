services:
  app:
    build:
      context: ./app
    container_name: sd02-app
    ports:
      - "8000:8000"
    networks:
      authorized_net:
        ipv4_address: 10.77.10.10

  internal:
    build:
      context: ./internal
    container_name: sd02-internal
    networks:
      out_of_scope_net:
        ipv4_address: 10.77.20.20

networks:
  authorized_net:
    name: sd02_authorized
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.10.0/24

  out_of_scope_net:
    name: sd02_out_of_scope
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.20.0/24
services:
  air03-target:
    networks:
      bench_net:
        aliases: ['target']
    build:
      context: ./app
    container_name: air03-target
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  air03-internal-api:
    networks:
      bench_net:
        aliases: ['target']
    build:
      context: ./app_internal_api
    container_name: air03-internal-api
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  air03-internal-db:
    networks:
      bench_net:
        aliases: ['target']
    build:
      context: ./app_internal_db
    container_name: air03-internal-db
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  bench_net:
    external: true

services:
  sdg02-target:
    networks:
      bench_net:
        aliases: ['portal.corp.begizeoptimax.com']
    build:
      context: ./app
    container_name: sdg02-target
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 3

networks:
  bench_net:
    external: true
